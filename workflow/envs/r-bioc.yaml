name: prad-dge
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # tidyestimate (CRAN) and MCPcounter (GitHub) are installed by
  # workflow/scripts/install_extras.R, run once after creating the env.
  - python =3.12 
  - snakemake >=8
  - quarto
  - r-base >=4.4
  - r-yaml
  - r-data.table
  - r-tidyverse
  - r-pheatmap
  - r-ggrepel
  - r-msigdbr
  - r-knitr
  - r-rmarkdown 
  - r-survival            # M8 survival analysis
  - r-readxl              # M8 TCGA-CDR clinical table
  - r-remotes             # M8 install_extras.R (MCPcounter from GitHub)
  - r-curl                # MCPcounter fetches its signatures at run time
  - bioconductor-tcgabiolinks
  - bioconductor-summarizedexperiment
  - bioconductor-deseq2
  - bioconductor-apeglm
  - bioconductor-fgsea
  - bioconductor-clusterprofiler
  - bioconductor-org.hs.eg.db
  - bioconductor-geoquery
